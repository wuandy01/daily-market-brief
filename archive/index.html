<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷史週報 — Andy大恆哥的每日財經摘要</title>
<meta name="description" content="每週市場週報典藏，彙整當週美股、台股、總體經濟新聞與市場分析。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef1f0; --surface:#ffffff; --ink:#1b2430; --ink-soft:#56606f; --ink-faint:#8b95a1;
    --accent:#a8791f; --rule:#d8dcd7;
    --shadow: 0 1px 2px rgba(27,36,48,0.04), 0 6px 16px -8px rgba(27,36,48,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10141b; --surface:#171d27; --ink:#e7e9ec; --ink-soft:#9aa5b1; --ink-faint:#6b7684; --accent:#dcae52; --rule:#2a3341; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5); }
  }
  :root[data-theme="dark"]{ --bg:#10141b; --surface:#171d27; --ink:#e7e9ec; --ink-soft:#9aa5b1; --ink-faint:#6b7684; --accent:#dcae52; --rule:#2a3341; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5); }
  :root[data-theme="light"]{ --bg:#eef1f0; --surface:#ffffff; --ink:#1b2430; --ink-soft:#56606f; --ink-faint:#8b95a1; --accent:#a8791f; --rule:#d8dcd7; --shadow: 0 1px 2px rgba(27,36,48,0.04), 0 6px 16px -8px rgba(27,36,48,0.10); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Iowan Old Style","Noto Serif TC","Songti TC","Source Han Serif TC",Georgia,"Times New Roman",serif;}
  a{color:inherit;}
  main{max-width:720px;margin:0 auto;padding:2.6rem 1.5rem 4rem;}
  .kicker{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .back-link{font-size:0.82rem;color:var(--ink-soft);text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;margin-bottom:0.6rem;}
  h1{font-size:1.9rem;margin:0.3rem 0 0.4rem;font-weight:600;letter-spacing:-0.01em;}
  .lede{font-size:0.9rem;color:var(--ink-soft);margin:0 0 2rem;max-width:56ch;}
  .rule{height:1px;background:var(--rule);margin:0 0 1.6rem;}
  .empty{
    background:var(--surface);border:1px solid var(--rule);border-radius:10px;
    padding:2rem 1.5rem;text-align:center;color:var(--ink-faint);font-size:0.88rem;box-shadow:var(--shadow);
  }
  .weeks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.7rem;}
  .weeks li a{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    background:var(--surface);border:1px solid var(--rule);border-radius:10px;
    padding:0.9rem 1.1rem;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .weeks li a:hover{transform:translateY(-1px);border-color:var(--accent);}
  .weeks li .range{font-weight:600;font-size:0.92rem;}
  .weeks li .arrow{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<main>
  <a class="back-link" href="../index.html">← 回到每日摘要</a>
  <div class="kicker">Weekly Archive</div>
  <h1 class="serif">歷史週報典藏</h1>
  <p class="lede">每週彙整一次當週美股、台股、總體經濟的重點新聞與市場分析，方便回顧過去一週的市場脈絡。</p>
  <div class="rule"></div>

  <ul class="weeks" id="weekList">
    <!-- 週報項目將自動累加於此，最新一則排在最上方 -->
  </ul>
  <div class="empty" id="emptyState">目前尚無歷史週報，將於每週六台北時間早上自動產生第一份週報。</div>
</main>
</body>
</html>
